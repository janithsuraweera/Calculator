name: calaculater
description: "A modern Material Design calculator app by Janith Suraweera"

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Math and Storage
  math_expressions: ^2.4.0
  shared_preferences: ^2.2.2

  # Camera + ML Kit (for handwriting or text recognition)
  camera: ^0.11.0
  google_mlkit_text_recognition: ^0.15.0

  # Authentication (PIN / Fingerprint)
  local_auth: ^2.2.0

  # Permissions handler (for camera & biometrics)
  permission_handler: ^11.3.1

  # Optional - Flutter SVG (for vector logo or icons)
  flutter_svg: ^2.0.9

  # State management (theme / history / localization)
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # For launcher icon generation
  flutter_launcher_icons: ^0.10.0

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/icons/cal logo.png"
  adaptive_icon_background: "#003399"

flutter:
  uses-material-design: true

  assets:
    - lib/assets/icons/cal logo.png

  # Fonts can be added here if needed
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
